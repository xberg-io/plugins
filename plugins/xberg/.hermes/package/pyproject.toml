[build-system]
requires = ['hatchling>=1.27']
build-backend = 'hatchling.build'

[project]
name = 'xberg-hermes-plugin'
version = '0.2.3'
description = 'Local document extraction: text, tables, metadata, images from 91+ formats with optional OCR.'
requires-python = '>=3.11'
keywords = ['document-intelligence', 'extraction', 'ocr', 'pdf', 'tables']

[project.entry-points]
[project.entry-points.'hermes_agent.plugins']
xberg = 'xberg_hermes_plugin'

[project.urls]
Homepage = 'https://xberg.io'
Repository = 'https://github.com/xberg-io/plugins'

[tool]
[tool.hatch]
[tool.hatch.build]
[tool.hatch.build.targets]
[tool.hatch.build.targets.wheel]
packages = ['src/xberg_hermes_plugin']
