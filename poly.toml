required_version = ">=0.36.0"

[discovery]
exclude = ["/.ai-rulez/.generated-manifest.json", "/.mcp.json", "/mise-tasks/shared.toml", "/mise-tasks/.shared/**"]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = ["**/*.lock", "/.ai-rulez/.generated-manifest.json", "/.mcp.json"] }
fmt = { exclude = ["**/*.lock", "/.ai-rulez/.generated-manifest.json", "/.mcp.json"] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = ["**/*.lock", "/.ai-rulez/.generated-manifest.json", "/.mcp.json"] }

[tools.shfmt]
enabled = true

[tools.shellcheck]
enabled = true

[tools.actionlint]
enabled = true

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v5"
hooks = ["ai-rulez-validate"]

[engines.typos]
# Typos is opt-in in poly v2; this keeps the v1 default (on).
enabled = true

[engines.harper]
enabled = true
# Off: rules that contradict the org's sentence-case headings and no-Oxford-comma style, or misread technical prose
# (denylist, MB, stdin), and "plugin" read as a verb. ~keep
ignore = [
  "UseTitleCase",
  "OxfordComma",
  "SplitWords",
  "OrthographicConsistency",
  "ExpandMemoryShorthands",
  "ExpandStandardInputAndOutput",
  "ExpandConfiguration",
  "ExpandMinimum",
  "PhrasalVerbAsCompoundNoun",
]

[engines.rumdl.lang.markdown.lint]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076"]

[engines.rumdl.lang.markdown.format]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076"]

[per_file_ignores]
"**/*.md" = ["MD025"]
