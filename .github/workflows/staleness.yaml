name: Staleness

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  staleness:
    name: Pinned refs vs latest releases
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: Pinned plugin refs are behind the latest releases
    steps:
      - uses: actions/checkout@v6

      - name: Compare refs with latest releases
        id: check
        run: |
          set +e
          python3 scripts/staleness.py > report.md
          rc=$?
          cat report.md
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -le 1 ]

      - name: Open or update the tracking issue
        if: steps.check.outputs.rc == '1'
        run: |
          number=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file report.md
          fi

      - name: Close the tracking issue when current
        if: steps.check.outputs.rc == '0'
        run: |
          number=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "All pinned refs match the latest releases."
          fi
